name: use
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/reusable.yml
    with:
      myVar: var_from_calling
    secrets:
      DB_URL: ${{ secrets.PASSWORD }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: print outputs from reusable workflow
        run: echo "${{ needs.build.outputs.my-value }}"
