name: test
on:
  push:
    branches: main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Code
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: v22
      - name: Install Deps
        run: npm install
      - name: Run Eslint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
