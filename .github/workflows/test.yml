name: CI
env:
  NODE_VERSION: "v26"
  NODE_ENV: "Development"
  PASSWORD: ${{ secrets.PASSWORD }}
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      release-name: "${{ steps.version.outputs.app_version }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Cache Install
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Print Env Value
        run: |
          echo "$NODE_ENV"
          echo ${{ env.NODE_VERSION }}
          echo $PASSWORD

      - name: Build Application
        run: npm run build

      - name: set version
        id: version
        run: echo 'app_version=1.2.3' >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  output:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: ls
        run: ls
      - name: read-output
        run: echo "${{ needs.ci.outputs.release-name }}"
