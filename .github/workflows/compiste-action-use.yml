name: Composite-action
env:
  NODE_VERSION: "v26"
  NODE_ENV: "Development"
  PASSWORD: ${{ secrets.PASSWORD }}
on:
  push:
    branches: [main]
jobs:
  ci:
    environment: TESTING
    runs-on: ubuntu-latest
    outputs:
      release-name: "${{ steps.version.outputs.app_version }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: use custom composite action
        uses: ./.github/actions/install-cached

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Tests
        id: test-run
        run: npm test

      - name: Check test condition
        if: failure() && steps.test-run.outcome == 'failure'
        run: echo "test not uploaded"

      - name: Print Env Value
        run: |
          echo "$NODE_ENV"
          echo ${{ env.NODE_VERSION }}
          echo $PASSWORD

      - name: Build Application
        run: npm run build

      - name: set version
        id: version
        run: echo 'app_version=1.2.3' >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist

  output:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: ls
        run: ls
      - name: read-output
        run: echo "${{ needs.ci.outputs.release-name }}"
