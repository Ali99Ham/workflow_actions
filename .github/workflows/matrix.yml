name: matrix
on: workflow_dispatch
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
        include:
          - os: ubuntu-latest
            node-version: 18
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dep
        run: npm ci
      - name: Build Project
        run: echo "building..."
