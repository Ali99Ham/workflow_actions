name: reusable
on:
  workflow_call:
    inputs:
      myVar:
        type: string
        description: testing input var
        required: false
        default: var_test
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dep
        run: npm ci
      - name: printing inputs
        run: echo "${{ inputs.myVar }}"
      - name: Build Project
        run: echo "building..."
