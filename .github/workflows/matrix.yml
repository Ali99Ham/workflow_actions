name: matrix
on: push
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dep
        run: npm ci
      - name: Build Project
        run: echo "building..."
